<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | Gasto Inteligente</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #FAFAFB; color: #1E293B; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
        .card { background: white; padding: 2rem; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); max-width: 400px; }
        h1 { font-size: 1.5rem; margin-bottom: 1rem; }
        p { color: #64748B; margin-bottom: 2rem; line-height: 1.6; }
        button { background: #0F172A; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Você está sem conexão</h1>
        <p>Reconecte-se para acessar e atualizar seus dados financeiros com segurança. Nenhum dado privado é armazenado offline por segurança.</p>
        <button onclick="window.location.reload()">Tentar novamente</button>
    </div>
</body>
</html>
